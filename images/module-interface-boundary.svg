<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" width="1400" height="760" role="img" aria-labelledby="title desc">
  <title id="title">模块接口与内部函数的边界</title>
  <desc id="desc">房屋外侧可以使用接口家具，墙内齿轮代表不对外承诺的内部处理函数。</desc>
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M1 1l9 4.5L1 10z" fill="#5b2cb1"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#28153f" flood-opacity=".14"/>
    </filter>
    <style>
      .title{font:700 34px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#241536}
      .h{font:700 25px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#241536}
      .body{font:500 18px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#5d5268}
      .code{font:700 18px Consolas,"Microsoft YaHei",monospace;fill:#3b235c}
      .white{fill:#fff}
    </style>
  </defs>

  <rect width="1400" height="760" fill="#f7f8fb"/>
  <text x="70" y="70" class="title">接口是模块主动提供的使用方式</text>
  <text x="70" y="101" class="body">能被调用不等于属于接口；接口由命名规则和调用协议共同确定</text>
  <path d="M0 122h1400" stroke="#e2dced" stroke-width="2"/>

  <g filter="url(#shadow)">
    <rect x="305" y="165" width="790" height="515" rx="8" fill="#fff"/>
    <path d="M360 354L700 160l340 194" fill="#eadcff" stroke="#5b2cb1" stroke-width="10" stroke-linejoin="round"/>
    <path d="M400 332v280h600V332L700 171z" fill="#fff8f2" stroke="#5b2cb1" stroke-width="8" stroke-linejoin="round"/>
    <path d="M700 333v279M400 474h600" stroke="#b96755" stroke-width="8"/>

    <rect x="425" y="505" width="145" height="107" fill="#70b7c7" stroke="#3b235c" stroke-width="5"/>
    <rect x="466" y="536" width="62" height="76" fill="#fff" stroke="#3b235c" stroke-width="4"/>
    <circle cx="515" cy="575" r="5" fill="#3b235c"/>
    <text x="497" y="531" text-anchor="middle" class="code">_new</text>

    <rect x="795" y="508" width="152" height="55" rx="5" fill="#55b8a9" stroke="#3b235c" stroke-width="5"/>
    <path d="M814 563v49m114-49v49" stroke="#3b235c" stroke-width="5"/>
    <text x="871" y="543" text-anchor="middle" class="code">_get</text>

    <rect x="435" y="382" width="120" height="52" rx="5" fill="#ffcf66" stroke="#3b235c" stroke-width="5"/>
    <path d="M453 434v40m84-40v40" stroke="#3b235c" stroke-width="5"/>
    <text x="495" y="416" text-anchor="middle" class="code">init</text>

    <rect x="837" y="382" width="120" height="52" rx="5" fill="#ffcf66" stroke="#3b235c" stroke-width="5"/>
    <path d="M855 434v40m84-40v40" stroke="#3b235c" stroke-width="5"/>
    <text x="897" y="416" text-anchor="middle" class="code">main_c</text>

    <g transform="translate(610 356)">
      <circle cx="90" cy="115" r="72" fill="#ece8f1" stroke="#796b84" stroke-width="6" stroke-dasharray="10 8"/>
      <circle cx="90" cy="115" r="32" fill="#796b84"/>
      <circle cx="90" cy="115" r="13" fill="#fff"/>
      <path d="M90 31v28M90 171v28M6 115h28m112 0h28M31 56l20 20m78 78l20 20M31 174l20-20m78-78l20-20" stroke="#796b84" stroke-width="17" stroke-linecap="square"/>
      <rect x="-35" y="184" width="250" height="62" rx="8" fill="#fff8f2" fill-opacity=".96"/>
      <text x="90" y="205" text-anchor="middle" class="h">内部处理函数</text>
      <text x="90" y="233" text-anchor="middle" class="body">实现细节，不属于接口</text>
    </g>
  </g>

  <g>
    <circle cx="142" cy="352" r="45" fill="#5b2cb1"/>
    <circle cx="142" cy="327" r="15" fill="#fff"/>
    <path d="M111 382c7-31 55-31 62 0" fill="#fff"/>
    <text x="142" y="430" text-anchor="middle" class="h">外部调用者</text>
    <path d="M195 352h192" fill="none" stroke="#5b2cb1" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>
    <path d="M195 398h227" fill="none" stroke="#d19b24" stroke-width="4" stroke-dasharray="9 8" marker-end="url(#arrow)"/>
  </g>

  <g transform="translate(1128 180)">
    <rect width="220" height="254" rx="8" fill="#fff" stroke="#ddd5e5" stroke-width="3"/>
    <text x="24" y="42" class="h">接口命名</text>
    <rect x="24" y="66" width="172" height="45" rx="5" fill="#e6f5f2"/>
    <text x="110" y="95" text-anchor="middle" class="code">_api_name</text>
    <text x="24" y="144" class="body">特殊接口：</text>
    <text x="24" y="179" class="code">init</text>
    <text x="24" y="210" class="code">main*</text>
    <text x="112" y="210" class="code">tick*</text>
  </g>

  <g transform="translate(1128 468)">
    <rect width="220" height="170" rx="8" fill="#fff" stroke="#ddd5e5" stroke-width="3"/>
    <circle cx="43" cy="46" r="12" fill="#ffcf66" stroke="#3b235c" stroke-width="3"/>
    <text x="70" y="53" class="body">特殊接口</text>
    <circle cx="43" cy="91" r="12" fill="#55b8a9" stroke="#3b235c" stroke-width="3"/>
    <text x="70" y="98" class="body">下划线接口</text>
    <circle cx="43" cy="136" r="12" fill="#ece8f1" stroke="#796b84" stroke-width="3"/>
    <text x="70" y="143" class="body">内部实现</text>
  </g>
</svg>
