<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" width="1400" height="760" role="img" aria-labelledby="title desc">
  <title id="title">骨架模板与功能模板的组合</title>
  <desc id="desc">骨架模板建立房屋主体，功能模板增加测试设施，叠加后构建出完整模块。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1l10 5-10 5z" fill="#5b2cb1"/>
    </marker>
    <pattern id="blueGrid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22 0H0v22" fill="none" stroke="#a8dce7" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#28153f" flood-opacity=".14"/>
    </filter>
    <style>
      .title{font:700 34px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#241536}
      .h{font:700 25px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#241536}
      .body{font:500 18px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#5d5268}
      .code{font:700 19px Consolas,"Microsoft YaHei",monospace;fill:#3b235c}
    </style>
  </defs>

  <rect width="1400" height="760" fill="#f7f8fb"/>
  <text x="70" y="70" class="title">模板可以像图层一样叠加</text>
  <text x="70" y="101" class="body">先建立主体，再添加能力；同路径内容可由后加入的模板覆盖</text>
  <path d="M0 122h1400" stroke="#e2dced" stroke-width="2"/>

  <g filter="url(#shadow)">
    <rect x="65" y="165" width="390" height="220" rx="8" fill="#e9f7fa" stroke="#198ca4" stroke-width="4"/>
    <rect x="65" y="165" width="390" height="220" fill="url(#blueGrid)"/>
    <path d="M135 333V252l125-76 125 76v81M165 333v-66l95-58 95 58v66M260 209v124" fill="none" stroke="#198ca4" stroke-width="6" stroke-linejoin="round"/>
    <text x="260" y="424" text-anchor="middle" class="h">骨架模板</text>
    <text x="260" y="456" text-anchor="middle" class="code">vve_cublock_1.0</text>
    <text x="260" y="488" text-anchor="middle" class="body">墙体、房间与基础设施</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="65" y="527" width="390" height="150" rx="8" fill="#fff7dc" stroke="#d19b24" stroke-width="4"/>
    <path d="M98 584h80v53H98z" fill="#ffcf66" stroke="#3b235c" stroke-width="4"/>
    <path d="M114 606l15 16 32-35" fill="none" stroke="#3b235c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="229" cy="608" r="34" fill="#ef6f61" stroke="#3b235c" stroke-width="4"/>
    <circle cx="229" cy="608" r="20" fill="#fff" stroke="#3b235c" stroke-width="4"/>
    <circle cx="229" cy="608" r="7" fill="#5b2cb1"/>
    <text x="367" y="589" text-anchor="middle" class="h">功能模板</text>
    <text x="367" y="620" text-anchor="middle" class="code">vve_test_1.0</text>
    <text x="367" y="650" text-anchor="middle" class="body">添加自动化测试</text>
  </g>

  <path d="M492 305h108" fill="none" stroke="#5b2cb1" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M492 602h54q36 0 36-36V348" fill="none" stroke="#5b2cb1" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>
  <g transform="translate(520 245)">
    <rect x="0" y="0" width="34" height="34" fill="#70b7c7"/>
    <rect x="36" y="0" width="34" height="34" fill="#ffcf66"/>
    <rect x="18" y="36" width="34" height="34" fill="#ef6f61"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="620" y="165" width="715" height="512" rx="8" fill="#fff"/>
    <path d="M700 355l278-170 278 170" fill="#eadcff" stroke="#5b2cb1" stroke-width="10" stroke-linejoin="round"/>
    <path d="M735 337v270h486V337L978 193z" fill="#fff8f2" stroke="#5b2cb1" stroke-width="8" stroke-linejoin="round"/>
    <path d="M735 470h486M978 337v270" stroke="#b96755" stroke-width="8"/>

    <g fill="#70b7c7" stroke="#3b235c" stroke-width="5">
      <rect x="780" y="503" width="106" height="54" rx="5"/>
      <rect x="1038" y="503" width="112" height="54" rx="5"/>
    </g>
    <path d="M798 557v50m70-50v50m188-50v50m76-50v50" stroke="#3b235c" stroke-width="5"/>

    <rect x="770" y="377" width="140" height="60" rx="5" fill="#ffcf66" stroke="#3b235c" stroke-width="5"/>
    <path d="M800 402l16 16 38-38" fill="none" stroke="#3b235c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="862" y="423" class="code">test</text>

    <circle cx="1100" cy="405" r="43" fill="#ef6f61" stroke="#3b235c" stroke-width="5"/>
    <circle cx="1100" cy="405" r="27" fill="#fff" stroke="#3b235c" stroke-width="4"/>
    <circle cx="1100" cy="405" r="10" fill="#5b2cb1"/>

    <text x="978" y="640" text-anchor="middle" class="h">组合后的模块</text>
  </g>

  <rect x="745" y="280" width="190" height="48" rx="24" fill="#e6f5f2" stroke="#55b8a9" stroke-width="3"/>
  <text x="840" y="311" text-anchor="middle" class="body">主体结构</text>
  <rect x="1020" y="280" width="190" height="48" rx="24" fill="#fff3d2" stroke="#d19b24" stroke-width="3"/>
  <text x="1115" y="311" text-anchor="middle" class="body">附加能力</text>
</svg>
