<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" width="1400" height="760" role="img" aria-labelledby="title desc">
  <title id="title">模板、模块与接口的关系</title>
  <desc id="desc">蓝图代表模板，建成的房子代表模块，房内可使用的家具代表接口。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1l10 5-10 5z" fill="#5b2cb1"/>
    </marker>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0v24" fill="none" stroke="#b9e4ee" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#28153f" flood-opacity=".13"/>
    </filter>
    <style>
      .title{font:700 34px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#241536}
      .label{font:700 25px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#241536}
      .small{font:500 18px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#5d5268}
      .code{font:700 18px Consolas,"Microsoft YaHei",monospace;fill:#3b235c}
      .line{stroke:#5b2cb1;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>

  <rect width="1400" height="760" fill="#f7f8fb"/>
  <path d="M0 112h1400" stroke="#e2dced" stroke-width="2"/>
  <text x="70" y="70" class="title">从蓝图到可使用的房子</text>
  <text x="70" y="101" class="small">模板构建模块，模块通过接口向外提供功能</text>

  <g filter="url(#shadow)">
    <rect x="55" y="155" width="380" height="515" rx="8" fill="#fff"/>
    <rect x="75" y="175" width="340" height="385" rx="4" fill="#e9f7fa" stroke="#66b9ca" stroke-width="3"/>
    <rect x="75" y="175" width="340" height="385" fill="url(#grid)"/>
    <path d="M125 414V304l120-82 120 82v110M151 414V323l94-64 94 64v91M220 414v-76h50v76M151 350h46v-46h-46zm142 0h46v-46h-46z" fill="none" stroke="#198ca4" stroke-width="5" stroke-linejoin="round"/>
    <path d="M105 472h278M105 500h215M105 528h250" stroke="#66b9ca" stroke-width="4" stroke-linecap="round"/>
    <path d="M350 205l34 34-116 116-48 14 14-48z" fill="#ffcf66" stroke="#5b2cb1" stroke-width="4"/>
    <path d="M350 205l17-17 34 34-17 17" fill="#ef6f61" stroke="#5b2cb1" stroke-width="4"/>
    <text x="245" y="610" text-anchor="middle" class="label">模板</text>
    <text x="245" y="642" text-anchor="middle" class="small">构建模块的蓝图</text>
  </g>

  <path d="M462 410h88" fill="none" class="line" marker-end="url(#arrow)"/>
  <g transform="translate(475 345)">
    <rect x="0" y="0" width="32" height="32" fill="#8d62d4"/>
    <rect x="34" y="0" width="32" height="32" fill="#55b8a9"/>
    <rect x="17" y="34" width="32" height="32" fill="#ef6f61"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="560" y="155" width="520" height="515" rx="8" fill="#fff"/>
    <path d="M622 338l198-139 198 139" fill="#eddcff" stroke="#5b2cb1" stroke-width="9" stroke-linejoin="round"/>
    <path d="M650 326v245h340V326L820 207z" fill="#fff8f2" stroke="#5b2cb1" stroke-width="7" stroke-linejoin="round"/>
    <path d="M650 446h340M820 326v245" stroke="#b96755" stroke-width="7"/>
    <rect x="688" y="482" width="90" height="89" fill="#70b7c7" stroke="#3b235c" stroke-width="5"/>
    <rect x="713" y="507" width="40" height="64" fill="#f7f8fb" stroke="#3b235c" stroke-width="4"/>
    <rect x="865" y="482" width="86" height="43" rx="4" fill="#55b8a9" stroke="#3b235c" stroke-width="5"/>
    <path d="M879 525v46m58-46v46" stroke="#3b235c" stroke-width="5"/>
    <rect x="692" y="365" width="82" height="49" rx="5" fill="#ffcf66" stroke="#3b235c" stroke-width="5"/>
    <path d="M707 414v32m52-32v32" stroke="#3b235c" stroke-width="5"/>
    <circle cx="901" cy="389" r="34" fill="#ef6f61" stroke="#3b235c" stroke-width="5"/>
    <path d="M901 355v68m-34-34h68" stroke="#fff" stroke-width="6"/>
    <text x="820" y="610" text-anchor="middle" class="label">模块</text>
    <text x="820" y="642" text-anchor="middle" class="small">一组建成并协同工作的程序</text>
  </g>

  <path d="M1106 410h73" fill="none" class="line" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="1190" y="155" width="160" height="515" rx="8" fill="#fff"/>
    <rect x="1214" y="205" width="112" height="72" rx="6" fill="#ffcf66" stroke="#3b235c" stroke-width="4"/>
    <path d="M1230 277v30m80-30v30" stroke="#3b235c" stroke-width="5"/>
    <text x="1270" y="249" text-anchor="middle" class="code">_new</text>

    <rect x="1214" y="331" width="112" height="72" rx="6" fill="#55b8a9" stroke="#3b235c" stroke-width="4"/>
    <path d="M1230 403v30m80-30v30" stroke="#3b235c" stroke-width="5"/>
    <text x="1270" y="375" text-anchor="middle" class="code">main</text>

    <rect x="1214" y="457" width="112" height="72" rx="6" fill="#70b7c7" stroke="#3b235c" stroke-width="4"/>
    <path d="M1230 529v30m80-30v30" stroke="#3b235c" stroke-width="5"/>
    <text x="1270" y="501" text-anchor="middle" class="code">_get</text>

    <text x="1270" y="610" text-anchor="middle" class="label">接口</text>
    <text x="1270" y="642" text-anchor="middle" class="small">可供外部使用</text>
  </g>
</svg>
