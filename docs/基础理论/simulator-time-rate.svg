<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 720" width="1400" height="720" role="img" aria-labelledby="title desc">
  <title id="title">模拟器时间倍率与两类回调</title>
  <desc id="desc">global_rate 决定每游戏刻的模拟子步数，global_inv_dt 决定完整物理步的拆分数，tick 回调每子步执行，sync 回调在游戏刻末可选执行一次。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1l10 5-10 5z" fill="#5b2cb1"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#28153f" flood-opacity=".13"/></filter>
    <style>.title{font:700 34px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#241536}.h{font:700 23px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#241536}.body{font:500 17px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#5d5268}.code{font:700 17px Consolas,"Microsoft YaHei",monospace;fill:#3b235c}.math{font:700 25px Cambria Math,"Microsoft YaHei",serif;fill:#3b235c}</style>
  </defs>
  <rect width="1400" height="720" fill="#f7f8fb"/>
  <text x="70" y="70" class="title">模拟时间倍率是一个非负有理数</text>
  <text x="70" y="103" class="body">分子决定每个游戏刻执行几次子步，分母决定一个完整物理步拆成几份</text>
  <path d="M0 124h1400" stroke="#e2dced" stroke-width="2"/>

  <g filter="url(#shadow)">
    <rect x="65" y="170" width="390" height="470" rx="8" fill="#fff"/>
    <text x="260" y="218" text-anchor="middle" class="h">时间倍率</text>
    <rect x="105" y="255" width="310" height="105" rx="8" fill="#eadcff"/>
    <text x="260" y="320" text-anchor="middle" class="math">speed = global_rate / global_inv_dt</text>
    <g transform="translate(105 395)">
      <rect width="145" height="62" rx="6" fill="#e9f7fa"/><text x="72" y="39" text-anchor="middle" class="code">4 / 1 = 4x</text>
      <rect x="165" width="145" height="62" rx="6" fill="#fff7dc"/><text x="237" y="39" text-anchor="middle" class="code">1 / 4 = 1/4x</text>
      <rect y="82" width="145" height="62" rx="6" fill="#e6f5f2"/><text x="72" y="121" text-anchor="middle" class="code">4 / 4 = 1x</text>
      <rect x="165" y="82" width="145" height="62" rx="6" fill="#fff0ed"/><text x="237" y="121" text-anchor="middle" class="code">0 / n = pause</text>
    </g>
    <text x="260" y="582" text-anchor="middle" class="body">global_inv_dt 必须为正整数</text>
    <text x="260" y="611" text-anchor="middle" class="body">global_rate 为非负整数</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="495" y="170" width="870" height="470" rx="8" fill="#fff"/>
    <text x="915" y="218" text-anchor="middle" class="h">一个 Minecraft 游戏刻中的调度</text>
    <path d="M555 465h720" stroke="#cfc6d9" stroke-width="6" marker-end="url(#arrow)"/>
    <g transform="translate(575 280)">
      <g>
        <rect x="0" y="0" width="145" height="120" rx="8" fill="#e9f7fa" stroke="#198ca4" stroke-width="3"/>
        <text x="72" y="39" text-anchor="middle" class="code">substep 1</text><text x="72" y="73" text-anchor="middle" class="body">tick_funcs</text><text x="72" y="101" text-anchor="middle" class="body">sim_mod + 1</text>
      </g>
      <g transform="translate(175)">
        <rect width="145" height="120" rx="8" fill="#e9f7fa" stroke="#198ca4" stroke-width="3"/>
        <text x="72" y="39" text-anchor="middle" class="code">substep 2</text><text x="72" y="73" text-anchor="middle" class="body">tick_funcs</text><text x="72" y="101" text-anchor="middle" class="body">sim_mod + 1</text>
      </g>
      <text x="365" y="68" class="h">...</text>
      <g transform="translate(415)">
        <rect width="145" height="120" rx="8" fill="#e9f7fa" stroke="#198ca4" stroke-width="3"/>
        <text x="72" y="39" text-anchor="middle" class="code">substep rate</text><text x="72" y="73" text-anchor="middle" class="body">tick_funcs</text><text x="72" y="101" text-anchor="middle" class="body">周期结算</text>
      </g>
      <path d="M567 60h68" stroke="#5b2cb1" stroke-width="6" marker-end="url(#arrow)"/>
      <g transform="translate(645)">
        <rect width="145" height="120" rx="8" fill="#fff7dc" stroke="#d19b24" stroke-width="3"/>
        <text x="72" y="39" text-anchor="middle" class="code">frame end</text><text x="72" y="73" text-anchor="middle" class="body">sync_funcs</text><text x="72" y="101" text-anchor="middle" class="body">可选，一次</text>
      </g>
    </g>
    <text x="915" y="522" text-anchor="middle" class="body">tick_funcs：每个模拟子步执行一次</text>
    <text x="915" y="556" text-anchor="middle" class="body">sync_funcs：所有子步完成后，每游戏刻最多执行一次</text>
    <rect x="665" y="585" width="500" height="40" rx="20" fill="#ece8f1"/>
    <text x="915" y="611" text-anchor="middle" class="body">目标 inv_dt 只在当前周期和余数补偿完成后生效</text>
  </g>
</svg>
