<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 720" width="1400" height="720" role="img" aria-labelledby="title desc">
  <title id="title">从刚体碰撞点到介质响应</title>
  <desc id="desc">刚体生成多个碰撞点，每个碰撞点携带世界位置、瞬时速度和质量，经介质探测函数查询方块或实体介质并输出单点响应。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1l10 5-10 5z" fill="#5b2cb1"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#28153f" flood-opacity=".13"/></filter>
    <style>
      .title{font:700 34px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#241536}.h{font:700 23px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#241536}.body{font:500 17px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#5d5268}.code{font:700 17px Consolas,"Microsoft YaHei",monospace;fill:#3b235c}
    </style>
  </defs>
  <rect width="1400" height="720" fill="#f7f8fb"/>
  <text x="70" y="70" class="title">物体提供碰撞点，介质解释碰撞点</text>
  <text x="70" y="103" class="body">介质探测的最小输入单位是一个碰撞点，而不是整个刚体</text>
  <path d="M0 124h1400" stroke="#e2dced" stroke-width="2"/>

  <g filter="url(#shadow)">
    <rect x="55" y="180" width="310" height="440" rx="8" fill="#fff"/>
    <text x="210" y="226" text-anchor="middle" class="h">刚体与碰撞点</text>
    <g transform="translate(105 260) rotate(-12 105 105)">
      <rect x="28" y="28" width="154" height="154" fill="#eadcff" stroke="#5b2cb1" stroke-width="7"/>
      <g fill="#ef6f61" stroke="#3b235c" stroke-width="3">
        <circle cx="28" cy="28" r="10"/><circle cx="182" cy="28" r="10"/><circle cx="28" cy="182" r="10"/><circle cx="182" cy="182" r="10"/>
      </g>
      <circle cx="105" cy="105" r="11" fill="#5b2cb1"/>
      <path d="M105 105l70-25" stroke="#198ca4" stroke-width="6" marker-end="url(#arrow)"/>
    </g>
    <text x="210" y="508" text-anchor="middle" class="code">p + R·r</text>
    <text x="210" y="540" text-anchor="middle" class="code">v + ω×r</text>
    <text x="210" y="581" text-anchor="middle" class="body">位置、瞬时速度、c_mass</text>
  </g>

  <path d="M375 400h90" stroke="#5b2cb1" stroke-width="7" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="475" y="215" width="300" height="370" rx="8" fill="#e9f7fa" stroke="#66b9ca" stroke-width="3"/>
    <text x="625" y="260" text-anchor="middle" class="h">介质探测函数</text>
    <rect x="520" y="292" width="210" height="56" rx="6" fill="#fff" stroke="#198ca4" stroke-width="3"/>
    <text x="625" y="327" text-anchor="middle" class="code">vve:_detect_*</text>
    <path d="M625 365v53" stroke="#198ca4" stroke-width="5" marker-end="url(#arrow)"/>
    <g transform="translate(515 433)">
      <rect x="0" y="0" width="90" height="90" fill="#ffcf66" stroke="#3b235c" stroke-width="4"/>
      <path d="M0 30h90M30 0v90M60 0v90M0 60h90" stroke="#d19b24" stroke-width="3"/>
      <text x="45" y="119" text-anchor="middle" class="body">方块介质</text>
    </g>
    <g transform="translate(645 433)">
      <circle cx="45" cy="45" r="43" fill="#55b8a9" stroke="#3b235c" stroke-width="4"/>
      <rect x="21" y="21" width="48" height="48" fill="#fff8f2" stroke="#3b235c" stroke-width="3" transform="rotate(18 45 45)"/>
      <text x="45" y="119" text-anchor="middle" class="body">实体介质</text>
    </g>
  </g>

  <path d="M785 400h90" stroke="#5b2cb1" stroke-width="7" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="885" y="180" width="460" height="440" rx="8" fill="#fff"/>
    <text x="1115" y="226" text-anchor="middle" class="h">单个碰撞点的介质响应</text>
    <g transform="translate(930 270)">
      <rect x="0" y="0" width="175" height="58" rx="6" fill="#fff7dc"/><text x="18" y="36" class="code">material</text>
      <rect x="195" y="0" width="175" height="58" rx="6" fill="#fff0ed"/><text x="213" y="36" class="code">shift</text>
      <rect x="0" y="78" width="175" height="58" rx="6" fill="#e9f7fa"/><text x="18" y="114" class="code">impulse</text>
      <rect x="195" y="78" width="175" height="58" rx="6" fill="#e6f5f2"/><text x="213" y="114" class="code">friction</text>
      <rect x="0" y="156" width="175" height="58" rx="6" fill="#eadcff"/><text x="18" y="192" class="code">grab_layer</text>
      <rect x="195" y="156" width="175" height="58" rx="6" fill="#f3e8e5"/><text x="213" y="192" class="code">bounce_layer</text>
      <rect x="97" y="234" width="175" height="58" rx="6" fill="#ece8f1"/><text x="115" y="270" class="code">surface</text>
    </g>
    <text x="1115" y="590" text-anchor="middle" class="body">响应是数据协议，尚未修改刚体状态</text>
  </g>
</svg>
