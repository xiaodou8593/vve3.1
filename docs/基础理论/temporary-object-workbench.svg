<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" width="1400" height="760" role="img" aria-labelledby="title desc">
  <title id="title">临时对象是共享工作台</title>
  <desc id="desc">多个实例依次把状态搬到唯一的临时对象中计算，完成后写回；提前读取下一个实例会覆盖当前数据。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1l10 5-10 5z" fill="#5b2cb1"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#28153f" flood-opacity=".13"/>
    </filter>
    <style>
      .title{font:700 34px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#241536}
      .h{font:700 25px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#241536}
      .body{font:500 18px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#5d5268}
      .code{font:700 18px Consolas,"Microsoft YaHei",monospace;fill:#3b235c}
      .step{font:700 17px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#fff}
    </style>
  </defs>

  <rect width="1400" height="760" fill="#f7f8fb"/>
  <text x="70" y="70" class="title">临时对象是一张共享工作台</text>
  <text x="70" y="101" class="body">每次只处理一个实例：读取、计算、写回，然后再处理下一个</text>
  <path d="M0 122h1400" stroke="#e2dced" stroke-width="2"/>

  <g filter="url(#shadow)">
    <rect x="55" y="180" width="330" height="470" rx="8" fill="#fff"/>
    <text x="220" y="228" text-anchor="middle" class="h">等待处理的实例</text>
    <g transform="translate(98 270)">
      <path d="M55 0l55 32-55 32L0 32z" fill="#ffcf66" stroke="#3b235c" stroke-width="5"/>
      <path d="M0 32l55 32v62L0 94z" fill="#70b7c7" stroke="#3b235c" stroke-width="5"/>
      <path d="M110 32L55 64v62l55-32z" fill="#55b8a9" stroke="#3b235c" stroke-width="5"/>
      <rect x="129" y="37" width="118" height="72" rx="6" fill="#fff3d2" stroke="#3b235c" stroke-width="4"/>
      <text x="188" y="66" text-anchor="middle" class="code">实例 A</text>
      <text x="188" y="94" text-anchor="middle" class="code">x = 12</text>
    </g>
    <g transform="translate(98 430) scale(.82)">
      <path d="M55 0l55 32-55 32L0 32z" fill="#ef6f61" stroke="#3b235c" stroke-width="6"/>
      <path d="M0 32l55 32v62L0 94z" fill="#b88edc" stroke="#3b235c" stroke-width="6"/>
      <path d="M110 32L55 64v62l55-32z" fill="#8d62d4" stroke="#3b235c" stroke-width="6"/>
      <rect x="129" y="37" width="118" height="72" rx="6" fill="#f4eafb" stroke="#3b235c" stroke-width="5"/>
      <text x="188" y="66" text-anchor="middle" class="code">实例 B</text>
      <text x="188" y="94" text-anchor="middle" class="code">x = 47</text>
    </g>
    <text x="220" y="607" text-anchor="middle" class="body">每个实例的数据彼此独立</text>
  </g>

  <path d="M398 355h128" fill="none" stroke="#198ca4" stroke-width="6" marker-end="url(#arrow)"/>
  <rect x="421" y="306" width="82" height="38" rx="19" fill="#198ca4"/>
  <text x="462" y="332" text-anchor="middle" class="step">1  _get</text>

  <g filter="url(#shadow)">
    <rect x="540" y="180" width="410" height="470" rx="8" fill="#fff"/>
    <rect x="595" y="310" width="300" height="120" rx="8" fill="#ffcf66" stroke="#3b235c" stroke-width="6"/>
    <path d="M625 430v105m240-105v105M575 535h340" stroke="#3b235c" stroke-width="9" stroke-linecap="round"/>
    <rect x="646" y="235" width="198" height="100" rx="7" fill="#ece8f1" stroke="#796b84" stroke-width="5"/>
    <text x="745" y="275" text-anchor="middle" class="code">x int = 12</text>
    <text x="745" y="308" text-anchor="middle" class="code">vx int = 8</text>
    <g transform="translate(684 445)">
      <circle cx="61" cy="45" r="38" fill="#55b8a9" stroke="#3b235c" stroke-width="5"/>
      <circle cx="61" cy="45" r="13" fill="#fff" stroke="#3b235c" stroke-width="4"/>
      <path d="M61 0v13M61 77v13M16 45h13m64 0h13M29 13l9 9m46 46l9 9M29 77l9-9m46-46l9-9" stroke="#3b235c" stroke-width="9"/>
    </g>
    <text x="745" y="590" text-anchor="middle" class="h">唯一的临时对象</text>
    <text x="745" y="620" text-anchor="middle" class="body">读取新对象会覆盖当前内容</text>
  </g>

  <path d="M966 355h128" fill="none" stroke="#5b2cb1" stroke-width="6" marker-end="url(#arrow)"/>
  <rect x="982" y="306" width="96" height="38" rx="19" fill="#5b2cb1"/>
  <text x="1030" y="332" text-anchor="middle" class="step">3  _store</text>

  <g filter="url(#shadow)">
    <rect x="1110" y="180" width="235" height="300" rx="8" fill="#fff"/>
    <g transform="translate(1172 240)">
      <path d="M55 0l55 32-55 32L0 32z" fill="#ffcf66" stroke="#3b235c" stroke-width="5"/>
      <path d="M0 32l55 32v62L0 94z" fill="#70b7c7" stroke="#3b235c" stroke-width="5"/>
      <path d="M110 32L55 64v62l55-32z" fill="#55b8a9" stroke="#3b235c" stroke-width="5"/>
    </g>
    <text x="1227" y="410" text-anchor="middle" class="h">实例 A</text>
    <text x="1227" y="443" text-anchor="middle" class="code">x = 20</text>
  </g>

  <rect x="598" y="145" width="294" height="48" rx="24" fill="#55b8a9"/>
  <text x="745" y="176" text-anchor="middle" class="step">2  执行运算，修改临时数据</text>

  <g transform="translate(1098 520)">
    <rect width="260" height="130" rx="8" fill="#fff3d2" stroke="#d19b24" stroke-width="4"/>
    <path d="M35 82l28-50 28 50z" fill="#ef6f61" stroke="#3b235c" stroke-width="4"/>
    <text x="63" y="72" text-anchor="middle" class="h">!</text>
    <text x="112" y="53" class="h">注意覆盖</text>
    <text x="112" y="84" class="body">写回前不要读取</text>
    <text x="112" y="111" class="body">另一个实例</text>
  </g>
</svg>
