<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 720" width="1400" height="720" role="img" aria-labelledby="title desc">
  <title id="title">VVE 单次物理迭代流程</title>
  <desc id="desc">从实例读取状态，依次进行运动学迭代、介质探测、广义力学迭代和运动同步，最后保存实例状态。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1l10 5-10 5z" fill="#5b2cb1"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#28153f" flood-opacity=".13"/>
    </filter>
    <style>
      .title{font:700 34px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#241536}
      .h{font:700 23px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#241536}
      .body{font:500 17px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#5d5268}
      .code{font:700 18px Consolas,"Microsoft YaHei",monospace;fill:#3b235c}
    </style>
  </defs>

  <rect width="1400" height="720" fill="#f7f8fb"/>
  <text x="70" y="70" class="title">一次物理帧：先预测运动，再响应受力，最后同步表现</text>
  <text x="70" y="103" class="body">介质探测使用运动学迭代后的新位置与新姿态</text>
  <path d="M0 124h1400" stroke="#e2dced" stroke-width="2"/>

  <path d="M170 350H1230" stroke="#cfc6d9" stroke-width="8" stroke-linecap="round"/>

  <g filter="url(#shadow)">
    <rect x="45" y="247" width="205" height="205" rx="8" fill="#fff"/>
    <rect x="82" y="282" width="132" height="87" rx="6" fill="#ece8f1" stroke="#796b84" stroke-width="4"/>
    <path d="M101 306h94M101 326h66M101 346h82" stroke="#796b84" stroke-width="5" stroke-linecap="round"/>
    <text x="147" y="403" text-anchor="middle" class="code">_get</text>
    <text x="147" y="432" text-anchor="middle" class="body">读取实例状态</text>
  </g>

  <path d="M258 350h58" stroke="#5b2cb1" stroke-width="6" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="326" y="207" width="235" height="285" rx="8" fill="#e9f7fa" stroke="#66b9ca" stroke-width="3"/>
    <circle cx="392" cy="325" r="22" fill="#198ca4"/>
    <circle cx="493" cy="280" r="22" fill="#70b7c7"/>
    <path d="M414 316l55-25" stroke="#198ca4" stroke-width="7" marker-end="url(#arrow)"/>
    <path d="M390 355c56 26 102 15 130-24" fill="none" stroke="#198ca4" stroke-width="5" stroke-dasharray="9 8"/>
    <text x="444" y="411" text-anchor="middle" class="h">运动学迭代</text>
    <text x="444" y="442" text-anchor="middle" class="body">位置、姿态、局部坐标系</text>
    <text x="444" y="472" text-anchor="middle" class="code">state → pose</text>
  </g>

  <path d="M569 350h58" stroke="#5b2cb1" stroke-width="6" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="637" y="207" width="200" height="285" rx="8" fill="#fff7dc" stroke="#d19b24" stroke-width="3"/>
    <path d="M688 296h98l-20 91h-58z" fill="#ffcf66" stroke="#3b235c" stroke-width="5"/>
    <path d="M673 273h128M737 252v42" stroke="#3b235c" stroke-width="5" stroke-linecap="round"/>
    <path d="M696 317h82M701 342h72M707 367h60" stroke="#d19b24" stroke-width="4"/>
    <text x="737" y="421" text-anchor="middle" class="h">介质探测</text>
    <text x="737" y="452" text-anchor="middle" class="body">生成接触与响应数据</text>
  </g>

  <path d="M845 350h58" stroke="#5b2cb1" stroke-width="6" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="913" y="207" width="245" height="285" rx="8" fill="#fff0ed" stroke="#b96755" stroke-width="3"/>
    <rect x="996" y="295" width="78" height="78" fill="#ef6f61" stroke="#3b235c" stroke-width="5"/>
    <path d="M1035 273v-55M1035 395v55M974 334h-55M1096 334h55" stroke="#b96755" stroke-width="7" marker-end="url(#arrow)"/>
    <path d="M977 275l-38-38m154 154l38 38" stroke="#b96755" stroke-width="6"/>
    <text x="1035" y="421" text-anchor="middle" class="h">广义力学迭代</text>
    <text x="1035" y="452" text-anchor="middle" class="body">重力、响应、冲量、摩擦、修正</text>
  </g>

  <path d="M1166 350h53" stroke="#5b2cb1" stroke-width="6" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="1229" y="247" width="126" height="205" rx="8" fill="#fff"/>
    <rect x="1252" y="278" width="80" height="80" rx="5" fill="#55b8a9" stroke="#3b235c" stroke-width="4"/>
    <path d="M1272 339v-42l20-13 20 13v42" fill="#fff8f2" stroke="#3b235c" stroke-width="4"/>
    <text x="1292" y="403" text-anchor="middle" class="h">同步</text>
    <text x="1292" y="432" text-anchor="middle" class="body">写入世界实体</text>
  </g>

  <path d="M1292 470v84H147v-84" fill="none" stroke="#796b84" stroke-width="4" stroke-dasharray="10 9" marker-end="url(#arrow)"/>
  <rect x="540" y="548" width="320" height="76" rx="38" fill="#fff" stroke="#ddd5e5" stroke-width="3"/>
  <text x="700" y="579" text-anchor="middle" class="code">_store</text>
  <text x="700" y="608" text-anchor="middle" class="body">保存计算后的实例状态（不属于运动同步）</text>
</svg>
