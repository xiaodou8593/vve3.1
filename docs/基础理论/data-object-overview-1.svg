<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" width="1400" height="760" role="img" aria-labelledby="title desc">
  <title id="title">数据模板、临时对象与实例对象</title>
  <desc id="desc">产品配置单代表数据模板，共享加工台代表临时对象，多件拥有独立档案的产品代表实例对象。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1l10 5-10 5z" fill="#5b2cb1"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#28153f" flood-opacity=".13"/>
    </filter>
    <style>
      .title{font:700 34px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#241536}
      .h{font:700 25px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#241536}
      .body{font:500 18px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#5d5268}
      .code{font:700 18px Consolas,"Microsoft YaHei",monospace;fill:#3b235c}
    </style>
  </defs>

  <rect width="1400" height="760" fill="#f7f8fb"/>
  <text x="70" y="70" class="title">三种对象，三种职责</text>
  <text x="70" y="101" class="body">配置负责传递，工作台负责计算，实例负责长期保存自己的状态</text>
  <path d="M0 122h1400" stroke="#e2dced" stroke-width="2"/>

  <g filter="url(#shadow)">
    <rect x="55" y="165" width="370" height="500" rx="8" fill="#fff"/>
    <ellipse cx="143" cy="250" rx="58" ry="24" fill="#70b7c7" stroke="#3b235c" stroke-width="5"/>
    <path d="M85 250v116c0 13 26 24 58 24s58-11 58-24V250" fill="#bfe5ec" stroke="#3b235c" stroke-width="5"/>
    <path d="M85 309c0 13 26 24 58 24s58-11 58-24" fill="none" stroke="#3b235c" stroke-width="4"/>
    <rect x="195" y="220" width="185" height="230" rx="7" fill="#e9f7fa" stroke="#198ca4" stroke-width="5"/>
    <path d="M226 266h123M226 304h123M226 342h123M226 380h82" stroke="#66b9ca" stroke-width="5" stroke-linecap="round"/>
    <text x="226" y="260" class="code">mass</text>
    <text x="226" y="298" class="code">center</text>
    <text x="226" y="336" class="code">velocity</text>
    <circle cx="344" cy="411" r="18" fill="#ffcf66" stroke="#3b235c" stroke-width="4"/>
    <path d="M335 411l7 8 13-17" fill="none" stroke="#3b235c" stroke-width="4" stroke-linecap="round"/>
    <text x="240" y="520" text-anchor="middle" class="h">数据模板</text>
    <text x="240" y="555" text-anchor="middle" class="body">可存储、复制和传递</text>
    <text x="240" y="587" text-anchor="middle" class="body">不具有实例身份</text>
  </g>

  <path d="M445 408h100" fill="none" stroke="#5b2cb1" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="560" y="165" width="340" height="500" rx="8" fill="#fff"/>
    <rect x="610" y="300" width="240" height="105" rx="7" fill="#ffcf66" stroke="#3b235c" stroke-width="6"/>
    <path d="M635 405v95m190-95v95M596 500h268" stroke="#3b235c" stroke-width="8" stroke-linecap="round"/>
    <rect x="646" y="225" width="168" height="94" rx="6" fill="#ece8f1" stroke="#796b84" stroke-width="5"/>
    <text x="730" y="264" text-anchor="middle" class="code">x int</text>
    <text x="730" y="296" text-anchor="middle" class="code">mass int</text>
    <g transform="translate(680 421)">
      <circle cx="50" cy="50" r="37" fill="#55b8a9" stroke="#3b235c" stroke-width="5"/>
      <circle cx="50" cy="50" r="13" fill="#fff" stroke="#3b235c" stroke-width="4"/>
      <path d="M50 2v14M50 84v14M2 50h14m68 0h14M16 16l10 10m48 48l10 10M16 84l10-10m48-48l10-10" stroke="#3b235c" stroke-width="10"/>
    </g>
    <text x="730" y="555" text-anchor="middle" class="h">临时对象</text>
    <text x="730" y="590" text-anchor="middle" class="body">全局共享的计算工作台</text>
    <text x="730" y="622" text-anchor="middle" class="body">下一次读取会覆盖内容</text>
  </g>

  <path d="M920 408h100" fill="none" stroke="#5b2cb1" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="1035" y="165" width="310" height="500" rx="8" fill="#fff"/>
    <g transform="translate(1082 222)">
      <path d="M64 0l64 37-64 37L0 37z" fill="#ffcf66" stroke="#3b235c" stroke-width="5"/>
      <path d="M0 37l64 37v72L0 109z" fill="#70b7c7" stroke="#3b235c" stroke-width="5"/>
      <path d="M128 37L64 74v72l64-37z" fill="#55b8a9" stroke="#3b235c" stroke-width="5"/>
      <circle cx="64" cy="38" r="9" fill="#5b2cb1"/>
      <rect x="128" y="75" width="93" height="60" rx="5" fill="#fff3d2" stroke="#3b235c" stroke-width="4"/>
      <text x="174" y="100" text-anchor="middle" class="code">A</text>
      <text x="174" y="124" text-anchor="middle" class="code">x: 12</text>
    </g>
    <g transform="translate(1082 395) scale(.72)">
      <path d="M64 0l64 37-64 37L0 37z" fill="#ef6f61" stroke="#3b235c" stroke-width="6"/>
      <path d="M0 37l64 37v72L0 109z" fill="#b88edc" stroke="#3b235c" stroke-width="6"/>
      <path d="M128 37L64 74v72l64-37z" fill="#8d62d4" stroke="#3b235c" stroke-width="6"/>
      <rect x="128" y="75" width="120" height="60" rx="5" fill="#f4eafb" stroke="#3b235c" stroke-width="5"/>
      <text x="188" y="100" text-anchor="middle" class="code">B</text>
      <text x="188" y="124" text-anchor="middle" class="code">x: 47</text>
    </g>
    <text x="1190" y="555" text-anchor="middle" class="h">实例对象</text>
    <text x="1190" y="590" text-anchor="middle" class="body">每个实例独立保存状态</text>
    <text x="1190" y="622" text-anchor="middle" class="body">数据随实例持续存在</text>
  </g>
</svg>
