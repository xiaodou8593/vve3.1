<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" width="1400" height="760" role="img" aria-labelledby="title desc">
  <title id="title">刚体碰撞点模型</title>
  <desc id="desc">刚体的局部碰撞点根据姿态投影到世界空间，每个碰撞点携带位置、速度和等效质量。</desc>
  <defs>
    <marker id="purpleArrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M1 1l9 4.5L1 10z" fill="#5b2cb1"/></marker>
    <marker id="redArrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M1 1l9 4.5L1 10z" fill="#ef6f61"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#28153f" flood-opacity=".13"/></filter>
    <style>
      .title{font:700 34px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#241536}.h{font:700 24px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#241536}.body{font:500 18px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#5d5268}.code{font:700 17px Consolas,"Microsoft YaHei",monospace;fill:#3b235c}
    </style>
  </defs>
  <rect width="1400" height="760" fill="#f7f8fb"/>
  <text x="70" y="70" class="title">刚体用碰撞点描述接触</text>
  <text x="70" y="101" class="body">视觉外形与碰撞点模型相互独立，冲量可以同时改变平动和转动</text>
  <path d="M0 122h1400" stroke="#e2dced" stroke-width="2"/>

  <g filter="url(#shadow)">
    <rect x="55" y="165" width="290" height="500" rx="8" fill="#fff"/>
    <text x="200" y="215" text-anchor="middle" class="h">刚体状态</text>
    <g class="body">
      <circle cx="90" cy="269" r="8" fill="#8d62d4"/><text x="112" y="276">质心位置</text>
      <circle cx="90" cy="318" r="8" fill="#70b7c7"/><text x="112" y="325">线速度</text>
      <circle cx="90" cy="367" r="8" fill="#ef6f61"/><text x="112" y="374">角速度</text>
      <circle cx="90" cy="416" r="8" fill="#ffcf66"/><text x="112" y="423">四元数姿态</text>
      <circle cx="90" cy="465" r="8" fill="#55b8a9"/><text x="112" y="472">局部坐标系</text>
      <circle cx="90" cy="514" r="8" fill="#b96755"/><text x="112" y="521">质量与惯量</text>
    </g>
    <rect x="82" y="567" width="236" height="58" rx="6" fill="#f1edf6"/>
    <text x="200" y="592" text-anchor="middle" class="code">vve:object</text>
    <text x="200" y="615" text-anchor="middle" class="body">公共平动与转动运算</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="375" y="165" width="640" height="500" rx="8" fill="#fff"/>
    <polygon points="690,255 855,345 690,435 525,345" fill="#d7c3f6" stroke="#5b2cb1" stroke-width="7"/>
    <polygon points="525,345 690,435 690,585 525,495" fill="#70b7c7" fill-opacity=".82" stroke="#5b2cb1" stroke-width="7"/>
    <polygon points="855,345 690,435 690,585 855,495" fill="#55b8a9" fill-opacity=".82" stroke="#5b2cb1" stroke-width="7"/>
    <g fill="#ef6f61" stroke="#3b235c" stroke-width="4">
      <circle cx="690" cy="255" r="11"/><circle cx="855" cy="345" r="11"/><circle cx="690" cy="435" r="11"/><circle cx="525" cy="345" r="11"/><circle cx="525" cy="495" r="11"/><circle cx="690" cy="585" r="11"/><circle cx="855" cy="495" r="11"/>
    </g>
    <circle cx="690" cy="435" r="15" fill="#ffcf66" stroke="#3b235c" stroke-width="4"/>
    <path d="M690 435l118-63" stroke="#ef6f61" stroke-width="5" stroke-dasharray="9 8" marker-end="url(#redArrow)"/>
    <text x="771" y="425" class="code">r</text>
    <path d="M690 435h120" stroke="#5b2cb1" stroke-width="6" marker-end="url(#purpleArrow)"/>
    <text x="744" y="466" class="code">u</text>
    <path d="M690 435l-75-48" stroke="#198ca4" stroke-width="6" marker-end="url(#purpleArrow)"/>
    <text x="624" y="437" class="code">v</text>
    <path d="M690 435v-112" stroke="#d19b24" stroke-width="6" marker-end="url(#purpleArrow)"/>
    <text x="705" y="335" class="code">w</text>
    <path d="M555 271c65-56 196-62 271 0" fill="none" stroke="#ef6f61" stroke-width="6" stroke-linecap="round" marker-end="url(#redArrow)"/>
    <text x="690" y="215" text-anchor="middle" class="h">局部碰撞点 → 世界碰撞点</text>
    <text x="690" y="635" text-anchor="middle" class="body">每个点的位置和速度都由刚体当前姿态计算</text>
  </g>

  <path d="M1032 415h85" stroke="#5b2cb1" stroke-width="6" marker-end="url(#purpleArrow)"/>
  <g filter="url(#shadow)">
    <rect x="1130" y="220" width="220" height="390" rx="8" fill="#fff"/>
    <text x="1240" y="270" text-anchor="middle" class="h">碰撞点</text>
    <circle cx="1240" cy="340" r="28" fill="#ef6f61" stroke="#3b235c" stroke-width="5"/>
    <path d="M1274 340h55" stroke="#5b2cb1" stroke-width="6" marker-end="url(#purpleArrow)"/>
    <text x="1240" y="410" text-anchor="middle" class="code">center</text>
    <text x="1240" y="453" text-anchor="middle" class="code">velocity</text>
    <text x="1240" y="496" text-anchor="middle" class="code">c_mass</text>
    <path d="M1164 524h152" stroke="#ddd5e5" stroke-width="2"/>
    <text x="1240" y="558" text-anchor="middle" class="body">c_mass 是等效质量</text>
    <text x="1240" y="586" text-anchor="middle" class="body">由模型作者设定</text>
  </g>
</svg>
