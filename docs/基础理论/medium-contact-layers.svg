<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 720" width="1400" height="720" role="img" aria-labelledby="title desc">
  <title id="title">附着层、反弹层与浸入深度</title>
  <desc id="desc">沿接触面法向量反方向定义浸入深度；负值表示远离表面，浅层属于附着层，深层属于反弹层。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1l10 5-10 5z" fill="#5b2cb1"/></marker>
    <pattern id="solid" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M0 26L26 0M-8 8L8-8M18 34L34 18" stroke="#b96755" stroke-width="3"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#28153f" flood-opacity=".13"/></filter>
    <style>.title{font:700 34px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#241536}.h{font:700 24px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#241536}.body{font:500 18px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#5d5268}.code{font:700 18px Consolas,"Microsoft YaHei",monospace;fill:#3b235c}</style>
  </defs>
  <rect width="1400" height="720" fill="#f7f8fb"/>
  <text x="70" y="70" class="title">接触面附近分为附着层与反弹层</text>
  <text x="70" y="103" class="body">grab_depth 沿接触面法向量的反方向增加</text>
  <path d="M0 124h1400" stroke="#e2dced" stroke-width="2"/>

  <g filter="url(#shadow)">
    <rect x="65" y="165" width="820" height="490" rx="8" fill="#fff"/>
    <rect x="105" y="430" width="740" height="185" fill="#fff0ed"/>
    <rect x="105" y="500" width="740" height="115" fill="url(#solid)" opacity=".55"/>
    <rect x="105" y="430" width="740" height="70" fill="#fff7dc"/>
    <path d="M105 430h740" stroke="#3b235c" stroke-width="7"/>
    <text x="735" y="412" class="h">接触面</text>
    <text x="665" y="474" class="h">附着层 grab_layer</text>
    <text x="650" y="555" class="h">反弹层 bounce_layer</text>

    <path d="M300 430V260" stroke="#5b2cb1" stroke-width="7" marker-end="url(#arrow)"/>
    <text x="320" y="285" class="code">nvec</text>
    <path d="M380 280v270" stroke="#796b84" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="398" y="348" class="code">grab_depth</text>
    <text x="398" y="378" class="body">沿 −nvec 方向增加</text>

    <g>
      <circle cx="235" cy="330" r="25" fill="#70b7c7" stroke="#3b235c" stroke-width="4"/>
      <text x="135" y="325" class="code">depth &lt; 0</text><text x="135" y="354" class="body">远离表面</text>
      <circle cx="235" cy="462" r="25" fill="#ffcf66" stroke="#3b235c" stroke-width="4"/>
      <text x="135" y="513" class="body">浅层稳定接触</text>
      <circle cx="235" cy="550" r="25" fill="#ef6f61" stroke="#3b235c" stroke-width="4"/>
      <text x="135" y="595" class="body">深层碰撞</text>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="925" y="165" width="410" height="490" rx="8" fill="#fff"/>
    <text x="1130" y="215" text-anchor="middle" class="h">典型响应差异</text>
    <rect x="965" y="255" width="330" height="145" rx="8" fill="#fff7dc" stroke="#d19b24" stroke-width="3"/>
    <text x="995" y="294" class="h">附着层</text>
    <text x="995" y="329" class="body">低速支持力与切向摩擦</text>
    <text x="995" y="361" class="body">维持目标深度，提供着陆法线</text>
    <rect x="965" y="435" width="330" height="145" rx="8" fill="#fff0ed" stroke="#b96755" stroke-width="3"/>
    <text x="995" y="474" class="h">反弹层</text>
    <text x="995" y="509" class="body">消除穿透并施加反弹冲量</text>
    <text x="995" y="541" class="body">取消该点的附着层响应</text>
  </g>
</svg>
