<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" width="1400" height="760" role="img" aria-labelledby="title desc">
  <title id="title">质点、刚体与介质的关系</title>
  <desc id="desc">质点和刚体是运动模型，它们通过碰撞点探测介质，介质返回物理响应。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1l10 5-10 5z" fill="#5b2cb1"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#28153f" flood-opacity=".13"/></filter>
    <style>
      .title{font:700 34px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#241536}.h{font:700 25px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#241536}.body{font:500 18px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#5d5268}.code{font:700 17px Consolas,"Microsoft YaHei",monospace;fill:#3b235c}
    </style>
  </defs>
  <rect width="1400" height="760" fill="#f7f8fb"/>
  <text x="70" y="70" class="title">质点、刚体与介质</text>
  <text x="70" y="101" class="body">运动模型通过碰撞点感知环境，介质负责描述空间边界与响应</text>
  <path d="M0 122h1400" stroke="#e2dced" stroke-width="2"/>

  <g filter="url(#shadow)">
    <rect x="60" y="165" width="730" height="500" rx="8" fill="#fff"/>
    <rect x="84" y="188" width="682" height="52" rx="6" fill="#ede5fa"/>
    <text x="425" y="222" text-anchor="middle" class="h">运动模型</text>
    <path d="M425 262v350" stroke="#ddd5e5" stroke-width="3"/>

    <text x="255" y="295" text-anchor="middle" class="h">质点</text>
    <circle cx="228" cy="418" r="28" fill="#ffcf66" stroke="#3b235c" stroke-width="6"/>
    <path d="M260 418h95" stroke="#5b2cb1" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/>
    <path d="M228 385v-55" stroke="#ef6f61" stroke-width="5" stroke-dasharray="8 7"/>
    <text x="228" y="515" text-anchor="middle" class="body">位置 + 线速度</text>
    <text x="228" y="548" text-anchor="middle" class="body">一个中心碰撞点</text>
    <rect x="145" y="577" width="166" height="44" rx="22" fill="#fff3d2" stroke="#d19b24" stroke-width="3"/>
    <text x="228" y="606" text-anchor="middle" class="code">vve:point</text>

    <text x="595" y="295" text-anchor="middle" class="h">刚体</text>
    <polygon points="595,340 685,390 595,440 505,390" fill="#d7c3f6" stroke="#5b2cb1" stroke-width="6"/>
    <polygon points="505,390 595,440 595,535 505,485" fill="#70b7c7" stroke="#5b2cb1" stroke-width="6"/>
    <polygon points="685,390 595,440 595,535 685,485" fill="#55b8a9" stroke="#5b2cb1" stroke-width="6"/>
    <g fill="#ef6f61" stroke="#3b235c" stroke-width="3">
      <circle cx="595" cy="340" r="9"/><circle cx="685" cy="390" r="9"/><circle cx="595" cy="440" r="9"/><circle cx="505" cy="390" r="9"/><circle cx="505" cy="485" r="9"/><circle cx="595" cy="535" r="9"/><circle cx="685" cy="485" r="9"/>
    </g>
    <path d="M526 346c32-35 104-41 145-7" fill="none" stroke="#ef6f61" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>
    <text x="595" y="579" text-anchor="middle" class="body">平动 + 转动</text>
    <text x="595" y="610" text-anchor="middle" class="body">自定义碰撞点集合</text>
  </g>

  <path d="M810 410h95" fill="none" stroke="#5b2cb1" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>
  <circle cx="850" cy="380" r="11" fill="#ef6f61" stroke="#3b235c" stroke-width="3"/>
  <text x="853" y="464" text-anchor="middle" class="body">碰撞点探测</text>

  <g filter="url(#shadow)">
    <rect x="920" y="165" width="420" height="500" rx="8" fill="#fff"/>
    <rect x="944" y="188" width="372" height="52" rx="6" fill="#e6f5f2"/>
    <text x="1130" y="222" text-anchor="middle" class="h">介质</text>
    <path d="M978 305c31-36 90-23 90 22 35-21 78 6 65 44H978c-26-8-25-46 0-66z" fill="#dceff4" stroke="#198ca4" stroke-width="5"/>
    <path d="M963 440h334v124H963z" fill="#70b7c7" stroke="#198ca4" stroke-width="5"/>
    <path d="M963 456c38-28 72 28 110 0s72 28 110 0 72 28 114 0" fill="none" stroke="#fff" stroke-width="5"/>
    <path d="M963 564h334v53H963z" fill="#b96755" stroke="#3b235c" stroke-width="5"/>
    <rect x="1168" y="297" width="120" height="112" rx="5" fill="#ffcf66" stroke="#3b235c" stroke-width="5"/>
    <path d="M1187 409v31m82-31v31" stroke="#3b235c" stroke-width="5"/>
    <text x="1130" y="280" text-anchor="middle" class="body">空气 · 液体 · 方块 · 实体</text>
    <text x="1130" y="645" text-anchor="middle" class="body">返回法向、位移、冲量、摩擦等响应</text>
  </g>
</svg>
