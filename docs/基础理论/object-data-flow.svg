<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" width="1400" height="760" role="img" aria-labelledby="title desc">
  <title id="title">三种对象之间的数据流</title>
  <desc id="desc">数据模板与临时对象通过投射和建模互相转换，实例对象与临时对象通过读取和写回交换状态，数据模板通过新建接口生成实例。</desc>
  <defs>
    <marker id="purpleArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1l10 5-10 5z" fill="#5b2cb1"/>
    </marker>
    <marker id="tealArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1l10 5-10 5z" fill="#198ca4"/>
    </marker>
    <marker id="goldArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1l10 5-10 5z" fill="#d19b24"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#28153f" flood-opacity=".13"/>
    </filter>
    <style>
      .title{font:700 34px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#241536}
      .h{font:700 25px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#241536}
      .body{font:500 18px "Microsoft YaHei","Noto Sans SC",sans-serif;fill:#5d5268}
      .code{font:700 18px Consolas,"Microsoft YaHei",monospace;fill:#3b235c}
      .arrowLabel{font:700 19px Consolas,"Microsoft YaHei",monospace;fill:#fff}
    </style>
  </defs>

  <rect width="1400" height="760" fill="#f7f8fb"/>
  <text x="70" y="70" class="title">对象数据在三种形态之间流动</text>
  <text x="70" y="101" class="body">接口负责搬运和转换，实际计算集中发生在临时对象中</text>
  <path d="M0 122h1400" stroke="#e2dced" stroke-width="2"/>

  <g filter="url(#shadow)">
    <rect x="70" y="230" width="300" height="300" rx="8" fill="#fff"/>
    <rect x="123" y="278" width="194" height="145" rx="7" fill="#e9f7fa" stroke="#198ca4" stroke-width="5"/>
    <path d="M150 319h140M150 352h140M150 385h92" stroke="#66b9ca" stroke-width="5" stroke-linecap="round"/>
    <text x="220" y="474" text-anchor="middle" class="h">数据模板</text>
    <text x="220" y="505" text-anchor="middle" class="code">NBT Compound</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="550" y="230" width="300" height="300" rx="8" fill="#fff"/>
    <rect x="596" y="288" width="208" height="100" rx="7" fill="#ffcf66" stroke="#3b235c" stroke-width="5"/>
    <text x="700" y="329" text-anchor="middle" class="code">x int</text>
    <text x="700" y="362" text-anchor="middle" class="code">vx int</text>
    <path d="M620 388v55m160-55v55M605 443h190" stroke="#3b235c" stroke-width="7" stroke-linecap="round"/>
    <text x="700" y="474" text-anchor="middle" class="h">临时对象</text>
    <text x="700" y="505" text-anchor="middle" class="body">共享记分板工作区</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1030" y="230" width="300" height="300" rx="8" fill="#fff"/>
    <g transform="translate(1116 275)">
      <path d="M64 0l64 37-64 37L0 37z" fill="#ffcf66" stroke="#3b235c" stroke-width="5"/>
      <path d="M0 37l64 37v72L0 109z" fill="#70b7c7" stroke="#3b235c" stroke-width="5"/>
      <path d="M128 37L64 74v72l64-37z" fill="#55b8a9" stroke="#3b235c" stroke-width="5"/>
    </g>
    <text x="1180" y="474" text-anchor="middle" class="h">实例对象</text>
    <text x="1180" y="505" text-anchor="middle" class="code">@s 的数据</text>
  </g>

  <path d="M382 315h154" fill="none" stroke="#198ca4" stroke-width="6" marker-end="url(#tealArrow)"/>
  <rect x="422" y="274" width="86" height="38" rx="19" fill="#198ca4"/>
  <text x="465" y="300" text-anchor="middle" class="arrowLabel">_proj</text>

  <path d="M538 407H384" fill="none" stroke="#5b2cb1" stroke-width="6" marker-end="url(#purpleArrow)"/>
  <rect x="417" y="420" width="96" height="38" rx="19" fill="#5b2cb1"/>
  <text x="465" y="446" text-anchor="middle" class="arrowLabel">_model</text>

  <path d="M1018 315H864" fill="none" stroke="#198ca4" stroke-width="6" marker-end="url(#tealArrow)"/>
  <rect x="897" y="274" width="86" height="38" rx="19" fill="#198ca4"/>
  <text x="940" y="300" text-anchor="middle" class="arrowLabel">_get</text>

  <path d="M862 407h154" fill="none" stroke="#5b2cb1" stroke-width="6" marker-end="url(#purpleArrow)"/>
  <rect x="892" y="420" width="96" height="38" rx="19" fill="#5b2cb1"/>
  <text x="940" y="446" text-anchor="middle" class="arrowLabel">_store</text>

  <path d="M220 548v68q0 44 44 44h872q44 0 44-44v-68" fill="none" stroke="#d19b24" stroke-width="6" stroke-linecap="round" marker-end="url(#goldArrow)"/>
  <rect x="650" y="631" width="100" height="42" rx="21" fill="#d19b24"/>
  <text x="700" y="659" text-anchor="middle" class="arrowLabel">_new</text>
  <text x="700" y="716" text-anchor="middle" class="body">数据模板作为输入，创建并初始化一个新的实例对象</text>

  <rect x="581" y="151" width="238" height="48" rx="24" fill="#f4eafb" stroke="#8d62d4" stroke-width="3"/>
  <text x="700" y="182" text-anchor="middle" class="body">物理与逻辑运算发生在这里</text>
  <path d="M700 199v20" stroke="#8d62d4" stroke-width="4" marker-end="url(#purpleArrow)"/>
</svg>
